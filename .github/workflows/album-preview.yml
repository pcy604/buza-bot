# 시황 카드뉴스(사이트 화면 + 문장) 미리보기 — 소유자에게만 (2026-11-25)
name: album-preview
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'kr | daily'
        default: 'kr'
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 미리보기 발송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT: ${{ secrets.OWNER_CHAT }}
        run: python -m report_album preview "${{ inputs.kind }}"
      - name: 캡처 실패 화면
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: /tmp/tmp*/card_*.png
          if-no-files-found: ignore
