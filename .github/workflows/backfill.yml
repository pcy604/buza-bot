# 기존 리포트 데이터에 대가 관점 서술(VALUE_CHAIN·LYNCH) 채우기 — 수동 실행 전용(2026-10-20).
# 산업 지도·린치 2분 점검 페이지용. 종목당 LLM 1회. 끝나면 fixture(SATL·PLTR)도 다시 받는다.
name: deck-backfill-guru

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: '비우면 비어 있는 종목 전부, 아니면 공백 구분 티커(덮어씀)'
        required: false
        default: ''

concurrency:
  group: buza-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 한글 폰트
        run: sudo apt-get install -y -q fonts-nanum >/dev/null
      - name: 서술 채우기
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_KEY:     ${{ secrets.GEMINI_KEY }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
          DART_KEY:       ${{ secrets.DART_KEY }}
        run: |
          cd decks
          python backfill_guru.py ${{ github.event.inputs.tickers }}
          for t in SATL PLTR; do LIVE_FIXTURE_DIR=fixtures LIVE_DUMP=1 python -c "import build,sys; build.build(sys.argv[1])" "$t" > /dev/null || true; done
      - name: 커밋
        run: |
          git config user.name "buza-bot"
          git config user.email "buza-bot@users.noreply.github.com"
          git add decks/*_data.py
          git add -f decks/fixtures
          git diff --cached --quiet && exit 0
          git commit -m "backfill: 대가 관점 서술(VALUE_CHAIN·LYNCH) ${{ github.event.inputs.tickers }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
